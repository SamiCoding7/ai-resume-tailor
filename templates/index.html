<!DOCTYPE html>
<html>
<head>
    <title>AI Resume Tailor</title>
</head>
<body>
    <h1>AI Resume Tailor</h1>
    <p>Upload your resume and paste a job description to get AI-powered feedback.</p>
    
    <form action="/analyze" method="POST" enctype="multipart/form-data">
        
        <label>Upload Resume (.txt or .pdf):</label><br>
        <input type="file" name="resume"><br><br>
        
        <label>Paste Job Description:</label><br>
        <textarea name="job_description" rows="10" cols="60"></textarea><br><br>
        
        <input type="submit" value="Analyze Resume">
        
    </form>
</body>
</html>
